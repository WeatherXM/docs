name: Apply docs GEO improvements

on:
  push:
    branches:
      - geo-discovery
    paths:
      - ".github/workflows/apply-geo-discovery.yaml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-discovery

      - name: Apply clean URLs, metadata and machine-readable docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          clean_routes = {
              "/weather-and-science/quality-mechanisms/general-qod-description.mdx":
                  "/weather-and-science/quality-mechanisms/general-qod-description",
              "/weather-and-science/quality-mechanisms/constancy-analysis-report.mdx":
                  "/weather-and-science/quality-mechanisms/constancy-analysis-report",
              "/weather-and-science/quality-mechanisms/obc-sqc-annotations.mdx":
                  "/weather-and-science/quality-mechanisms/obc-sqc-annotations",
              "/weather-and-science/quality-mechanisms/obc-sqc-documentation.mdx":
                  "/weather-and-science/quality-mechanisms/obc-sqc-documentation",
              "/weather-and-science/quality-mechanisms/isd-full-documentation.mdx":
                  "/weather-and-science/quality-mechanisms/isd-full-documentation",
              "/weather-and-science/quality-mechanisms/spv-full-documentation.mdx":
                  "/weather-and-science/quality-mechanisms/spv-full-documentation",
              "/weather-and-science/quality-mechanisms/obc-sqc-score-calculation.mdx":
                  "/weather-and-science/quality-mechanisms/obc-sqc-score-calculation",
          }

          # Clean explicit slugs and all internal links.
          for path in Path("docs").rglob("*"):
              if path.suffix not in {".md", ".mdx"}:
                  continue
              text = path.read_text()
              for old, new in clean_routes.items():
                  text = text.replace(old, new)
              path.write_text(text)

          # Improve deployment page semantics/accessibility.
          deployment = Path("docs/wxm-devices/deployment-examples.mdx")
          text = deployment.read_text()
          text = text.replace(
              "title: Deployment Examples\nhide_title: true\nsidebar_label: Deployment Examples",
              "title: Weather Station Deployment Examples\n"
              "description: Real-world examples of good and problematic WeatherXM weather station installations, with guidance on mast height, obstacles, wind exposure, rain, temperature and solar radiation.\n"
              "sidebar_label: Deployment Examples"
          )
          marker = 'import useBaseUrl from "@docusaurus/useBaseUrl";\n'
          intro = (
              '\nUse these real-world examples to evaluate where to install a WeatherXM station and how nearby roofs, walls, trees, fences and chimneys can affect measurements. '
              'For the best data quality, place the outdoor sensor as high and as clear of nearby obstacles as practical, following the installation guidance for your station model.\n'
          )
          if intro.strip() not in text:
              text = text.replace(marker, marker + intro)

          alt_map = {
            "good-example-1.webp": "WeatherXM station installed high above an apartment roof on a tall mast",
            "good-example-2.webp": "WeatherXM station on a rooftop with a clear horizon and nearby trees below sensor level",
            "good-example-3.webp": "Second view of a rooftop WeatherXM station with mostly unobstructed exposure",
            "good-example-4.webp": "WeatherXM station on a very tall mast above a roof and sparse palm trees",
            "good-example-5.webp": "WeatherXM station on a 2.5 metre mast in an open area with a clear horizon",
            "good-example-6.webp": "Second view of an open WeatherXM station deployment with a distant house",
            "bad-example-1.webp": "WeatherXM station mounted near a fence, bush and surrounding buildings",
            "bad-example-2.webp": "Second view of a WeatherXM station with nearby fence and vegetation obstacles",
            "bad-example-3.webp": "East-facing view from a WeatherXM station surrounded by trees",
            "bad-example-4.webp": "North-facing view from a WeatherXM station surrounded by trees",
            "bad-example-5.webp": "South-facing view from a WeatherXM station surrounded by trees",
            "bad-example-6.webp": "West-facing view and obstacle context for a WeatherXM station deployment",
            "bad-example-7.webp": "Suggested nearby rooftop location for improving a WeatherXM station deployment",
            "bad-example-8.webp": "WeatherXM station mounted only slightly above a wooden structure",
            "bad-example-9.webp": "WeatherXM rooftop station before raising the sensor farther above nearby obstacles",
            "bad-example-10.webp": "WeatherXM rooftop station after raising the sensor to improve exposure",
            "bad-example-11.webp": "WeatherXM station mounted beside and below the top of a chimney structure",
            "bad-example-12.webp": "WeatherXM station installed on a balcony close to a wall and roof",
            "bad-example-13.webp": "WeatherXM station near a chimney with taller buildings and trees around it",
          }
          for filename, alt in alt_map.items():
              pattern = rf'(<img\b[^>]*src={{useBaseUrl\("img/wxm-devices/deployments/{re.escape(filename)}"\)}})(?![^>]*\balt=)'
              text, n = re.subn(pattern, rf'\1 alt="{alt}"', text)
              if n != 1:
                  raise SystemExit(f"Expected one image for {filename}, found {n}")
          deployment.write_text(text)

          # Redirect old .mdx routes to clean canonical URLs.
          redirects = Path("redirects.js")
          rtext = redirects.read_text().rstrip()
          if rtext.endswith("]"):
              rtext = rtext[:-1].rstrip()
          additions = []
          for old, new in clean_routes.items():
              if f'from: "{old}"' not in rtext:
                  additions.append(
                      '  {\n'
                      f'    to: "{new}",\n'
                      f'    from: "{old}"\n'
                      '  }'
                  )
          if additions:
              if not rtext.endswith("["):
                  rtext += ",\n"
              rtext += ",\n".join(additions)
          redirects.write_text(rtext + "\n]\n")

          # Explicit crawler policy and sitemap discovery.
          Path("static/robots.txt").write_text(
              "User-agent: *\n"
              "Allow: /\n\n"
              "User-agent: OAI-SearchBot\n"
              "Allow: /\n\n"
              "Sitemap: https://docs.weatherxm.com/sitemap.xml\n"
          )

          # Build-time generator for llms.txt, llms-full.txt and per-page Markdown mirrors.
          Path("scripts").mkdir(exist_ok=True)
          Path("scripts/generate-llms.mjs").write_text(r'''import fs from "node:fs";
          import path from "node:path";

          const docsDir = "docs";
          const staticDir = "static";
          const mirrorDir = path.join(staticDir, "llms-pages");

          fs.rmSync(mirrorDir, { recursive: true, force: true });
          fs.mkdirSync(mirrorDir, { recursive: true });

          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const p = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(p) : [p];
          });

          const parseFrontmatter = (source) => {
            if (!source.startsWith("---\n")) return { fm: {}, body: source };
            const end = source.indexOf("\n---\n", 4);
            if (end === -1) return { fm: {}, body: source };
            const raw = source.slice(4, end);
            const fm = {};
            for (const line of raw.split("\n")) {
              const m = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
              if (m) fm[m[1]] = m[2].replace(/^["']|["']$/g, "");
            }
            return { fm, body: source.slice(end + 5) };
          };

          const cleanBody = (body) => body
            .replace(/^import\s+.*;\s*$/gm, "")
            .replace(/<img\b[^>]*\balt=["']([^"']+)["'][^>]*\/?\s*>/gi, "![$1](image)")
            .replace(/<img\b[^>]*\/?\s*>/gi, "")
            .replace(/<\/?(?:div|span|figure|figcaption|p|table|thead|tbody|tr|td|th)[^>]*>/gi, "")
            .replace(/\n{3,}/g, "\n\n")
            .trim();

          const routeFor = (file, fm) => {
            if (fm.slug) return fm.slug;
            let rel = path.relative(docsDir, file).replace(/\\/g, "/").replace(/\.(md|mdx)$/i, "");
            if (rel === "home") return "/";
            if (rel.endsWith("/index")) rel = rel.slice(0, -6);
            return "/" + rel;
          };

          const files = walk(docsDir).filter((p) => /\.(md|mdx)$/i.test(p));
          const pages = [];

          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            const { fm, body } = parseFrontmatter(source);
            const route = routeFor(file, fm);
            const title = fm.title || route.split("/").filter(Boolean).pop() || "WeatherXM Docs";
            const description = fm.description || "";
            const clean = cleanBody(body);
            const mirror = (route === "/" ? "index" : route.replace(/^\//, "").replace(/\/$/, "")) + ".md";
            const mirrorPath = path.join(mirrorDir, mirror);
            fs.mkdirSync(path.dirname(mirrorPath), { recursive: true });
            fs.writeFileSync(
              mirrorPath,
              `# ${title}\n\nCanonical: https://docs.weatherxm.com${route}\n\n${description ? description + "\n\n" : ""}${clean}\n`
            );
            pages.push({ route, title, description, mirror: "/llms-pages/" + mirror.replace(/\\/g, "/"), clean });
          }

          pages.sort((a, b) => a.route.localeCompare(b.route));

          const keyRoutes = new Set([
            "/",
            "/introduction",
            "/wxm-devices/deployment-examples",
            "/wxm-devices/d1/introduction",
            "/wxm-devices/helium/introduction",
            "/wxm-devices/pulse/introduction",
            "/weather-and-science",
            "/weather-and-science/quality-mechanisms/general-qod-description",
            "/weatherxm-pro",
            "/faq",
            "/glossary"
          ]);

          const keyPages = pages.filter((p) => keyRoutes.has(p.route));
          const llms = [
            "# WeatherXM Documentation",
            "",
            "> Technical documentation for WeatherXM weather stations, deployment, data quality, rewards, WeatherXM Pro and weather science.",
            "",
            "## Canonical resources",
            "- Main WeatherXM site: https://weatherxm.com/",
            "- Weather station catalog: https://weatherxm.com/stations/",
            "- Data & forecasts: https://weatherxm.com/data/",
            "- Open technology: https://weatherxm.com/open/",
            "- Firmware flasher: https://flasher.weatherxm.com/",
            "- Network Association: https://weatherxm.network/",
            "- GitHub: https://github.com/WeatherXM",
            "",
            "## Key documentation",
            ...keyPages.flatMap((p) => [
              `- ${p.title}: https://docs.weatherxm.com${p.route}`,
              `  - Markdown: https://docs.weatherxm.com${p.mirror}`
            ]),
            "",
            "## Full corpus",
            "- Combined text corpus: https://docs.weatherxm.com/llms-full.txt",
            "- Individual Markdown mirrors are under https://docs.weatherxm.com/llms-pages/",
            "",
            "Use the canonical HTML URL when citing a page. Use the Markdown mirror when a text-only representation is easier to process.",
            ""
          ].join("\n");

          fs.writeFileSync(path.join(staticDir, "llms.txt"), llms);

          const full = [
            "# WeatherXM Documentation — full text corpus",
            "",
            "Canonical site: https://docs.weatherxm.com/",
            "Generated from the public WeatherXM documentation source at build time.",
            "",
            ...pages.flatMap((p) => [
              "---",
              `# ${p.title}`,
              `Canonical: https://docs.weatherxm.com${p.route}`,
              `Markdown: https://docs.weatherxm.com${p.mirror}`,
              "",
              p.clean,
              ""
            ])
          ].join("\n");

          fs.writeFileSync(path.join(staticDir, "llms-full.txt"), full);
          console.log(`Generated LLM discovery files for ${pages.length} docs pages`);
          ''')

          # Ensure every production build refreshes machine-readable mirrors.
          package = Path("package.json")
          pkg = json.loads(package.read_text())
          pkg.setdefault("scripts", {})["prebuild"] = "node scripts/generate-llms.mjs"
          package.write_text(json.dumps(pkg, indent=2) + "\n")
          PY

      - name: Generate machine-readable docs
        run: node scripts/generate-llms.mjs

      - name: Verify changes
        run: |
          set -euo pipefail
          test -f static/robots.txt
          test -f static/llms.txt
          test -f static/llms-full.txt
          test -f static/llms-pages/wxm-devices/deployment-examples.md
          ! grep -R -E 'slug: .*\.mdx$' docs
          ! grep -R -E '\]\(/weather-and-science/[^)]*\.mdx([)#]|$)' docs
          grep -q '^# Weather Station Deployment Examples' static/llms-pages/wxm-devices/deployment-examples.md
          grep -q 'alt="WeatherXM station installed high above' docs/wxm-devices/deployment-examples.mdx

      - name: Remove one-shot workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/apply-geo-discovery.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve docs GEO and machine discovery"
          git push origin HEAD:geo-discovery
