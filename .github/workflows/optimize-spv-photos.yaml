name: Optimize SPV guide photos

on:
  push:
    branches:
      - optimize-spv-photos
    paths:
      - ".github/workflows/optimize-spv-photos.yaml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-spv-photos

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Convert SPV photos to WebP
        shell: bash
        run: |
          set -euo pipefail
          dir="static/img/weather-and-science/spv-guide-photos"
          before=$(find "$dir" -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          count_before=$(find "$dir" -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) | wc -l)

          find "$dir" -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -print0 |
          while IFS= read -r -d '' f; do
            out="${f%.*}.webp"
            convert "$f" \
              -auto-orient \
              -resize '2000x2000>' \
              -strip \
              -quality 84 \
              -define webp:method=6 \
              "$out"
            rm "$f"
          done

          after=$(find "$dir" -maxdepth 1 -type f -name '*.webp' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          count_after=$(find "$dir" -maxdepth 1 -type f -name '*.webp' | wc -l)
          test "$count_before" -eq 50
          test "$count_after" -eq 50

          {
            echo "### SPV photo optimization"
            echo "- Files: $count_after"
            echo "- Before: $before bytes"
            echo "- After: $after bytes"
            awk -v b="$before" -v a="$after" 'BEGIN { printf "- Reduction: %.1f%%\n", (1-a/b)*100 }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update documentation references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          docs = Path("docs")
          pattern = re.compile(r'(img/weather-and-science/spv-guide-photos/[^)"\']+)\.(?:png|jpg|jpeg)')
          changed = 0
          replacements = 0

          for path in docs.rglob("*"):
              if path.suffix not in {".md", ".mdx"}:
                  continue
              text = path.read_text()
              updated, n = pattern.subn(r'\1.webp', text)
              if n:
                  path.write_text(updated)
                  changed += 1
                  replacements += n

          if replacements == 0:
              raise SystemExit("No SPV image references were updated")
          print(f"Updated {replacements} references across {changed} docs")
          PY

      - name: Verify no legacy SPV image references remain
        run: |
          set -euo pipefail
          test "$(find static/img/weather-and-science/spv-guide-photos -maxdepth 1 \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) | wc -l)" -eq 0
          if grep -R -E 'spv-guide-photos/[^)"[:space:]]+\.(png|jpg|jpeg)' docs; then
            echo "Legacy SPV image references remain"
            exit 1
          fi

      - name: Remove one-shot workflow and commit optimized photos
        run: |
          set -euo pipefail
          rm .github/workflows/optimize-spv-photos.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize SPV guide photos"
          git push origin HEAD:optimize-spv-photos
